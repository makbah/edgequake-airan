services:
  # EdgeQuake API Server
  # Multi-platform: supports linux/amd64 (Intel/AMD), linux/arm64 (Apple Silicon, ARM servers)
  # macOS:   docker compose up  (Docker Desktop auto-selects arm64 on M-series, amd64 on Intel)
  # Linux:   docker compose up  (uses native architecture)
  # Windows: docker compose up  (uses linux/amd64 via WSL2)
  # Override: DOCKER_DEFAULT_PLATFORM=linux/amd64 docker compose up
  # Multi-arch build: docker buildx build --platform linux/amd64,linux/arm64 -t edgequake .
  edgequake:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: edgequake
    restart: unless-stopped
    ports:
      - "${EDGEQUAKE_PORT:-8080}:8080"
    environment:
      - EDGEQUAKE_HOST=0.0.0.0
      - EDGEQUAKE_PORT=8080
      - DATABASE_URL=postgres://edgequake:${POSTGRES_PASSWORD:-edgequake_secret}@postgres:5432/edgequake
      # OpenAI
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      # Ollama
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      # LM Studio / vLLM
      - LMSTUDIO_HOST=${LMSTUDIO_HOST:-}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-}
      - LMSTUDIO_EMBEDDING_MODEL=${LMSTUDIO_EMBEDDING_MODEL:-}
      - LMSTUDIO_EMBEDDING_DIM=${LMSTUDIO_EMBEDDING_DIM:-}
      # Provider selection
      - EDGEQUAKE_LLM_PROVIDER=${EDGEQUAKE_LLM_PROVIDER:-ollama}
      - EDGEQUAKE_EMBEDDING_PROVIDER=${EDGEQUAKE_EMBEDDING_PROVIDER:-}
      # Default workspace models
      - EDGEQUAKE_DEFAULT_LLM_PROVIDER=${EDGEQUAKE_DEFAULT_LLM_PROVIDER:-}
      - EDGEQUAKE_DEFAULT_LLM_MODEL=${EDGEQUAKE_DEFAULT_LLM_MODEL:-}
      - EDGEQUAKE_DEFAULT_EMBEDDING_PROVIDER=${EDGEQUAKE_DEFAULT_EMBEDDING_PROVIDER:-}
      - EDGEQUAKE_DEFAULT_EMBEDDING_MODEL=${EDGEQUAKE_DEFAULT_EMBEDDING_MODEL:-}
      - EDGEQUAKE_DEFAULT_EMBEDDING_DIMENSION=${EDGEQUAKE_DEFAULT_EMBEDDING_DIMENSION:-}
      # Vision (PDF extraction)
      - EDGEQUAKE_VISION_PROVIDER=${EDGEQUAKE_VISION_PROVIDER:-}
      - EDGEQUAKE_VISION_MODEL=${EDGEQUAKE_VISION_MODEL:-}
      - EDGEQUAKE_VISION_TIMEOUT_SECS=${EDGEQUAKE_VISION_TIMEOUT_SECS:-600}
      # Workers & logging
      - WORKER_THREADS=${WORKER_THREADS:-4}
      - RUST_LOG=${RUST_LOG:-info,edgequake=debug}
    # FIX-DOCKER-OLLAMA: enables host.docker.internal on Linux.
    # On macOS/Windows Docker Desktop this is a no-op (already resolved).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edgequake-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # EdgeQuake Frontend (Next.js)
  frontend:
    build:
      context: ../../
      dockerfile: edgequake_webui/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: edgequake-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NODE_ENV=production
    depends_on:
      - edgequake
    networks:
      - edgequake-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL with pgvector and Apache AGE extensions
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: edgequake-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=edgequake
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edgequake_secret}
      - POSTGRES_DB=edgequake
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - edgequake-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgequake -d edgequake"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    driver: local

networks:
  edgequake-network:
    driver: bridge
